name: Breaking AI News Check

on:
  schedule:
    # 매 30분마다 실행
    - cron: "*/30 * * * *"
  workflow_dispatch: # 수동 실행 가능

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 이전에 전송한 뉴스 ID 캐시 복원
      - name: Restore sent cache
        uses: actions/cache@v4
        with:
          path: sent_ids.json
          key: sent-ids-${{ github.run_id }}
          restore-keys: sent-ids-

      - name: Check breaking news
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/breaking_check.py

      # 캐시 업데이트를 위해 항상 새 키로 저장됨 (run_id 기반)
